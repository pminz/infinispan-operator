name: Post release Job
'on':
  schedule:
    - cron: '*/30 * * * *'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "pminz"
          git config --global user.email "pminz@redhat.com"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: operator
          ref: '${{ env.REF }}'
          token: '${{ secrets.PAT }}'
      - name: Set parameters
        id: params
        run: |
          echo "REF=${{ env.REF }}" >> $GITHUB_ENV
          echo "REL_VERSION=${{ env.REL_VERSION }}" >> $GITHUB_ENV
      - name: Set Next Version
        id: set_version
        run: ./scripts/ci/bump_version.sh
      - name: Check if the image exists
        id: check_image
        run: >-
          docker manifest inspect quay.io/pminz/infinispan-operator:v${{
          steps.set_version.outputs.new_tag }}
      - name: Update the version file to next version
        if: '${{ success() }}'
        env:
          NEXT_VERSION: '${{ steps.bump_tag.outputs.next_version }}'
          PREV_VERSION: '${{ steps.bump_tag.outputs.prev_ver }}'
        run: >
          cd operator

          echo "$NEXT_VERSION" > version.txt

          sed -i "s/export VERSION=.*/export VERSION=$NEXT_VERSION/"
          scripts/ci/install-catalog-source.sh

          sed -i -E "s/^[[:space:]]*(for version in [^;]*)(;[[:space:]]*do)/\1
          $NEXT_VERSION\2/" scripts/create-olm-catalog.sh

          ./scripts/ci/add_next_version.sh  scripts/test-catalog.yml
          infinispan-operator.v$NEXT_VERSION infinispan-operator.v$PREV_VERSION

          sed -i -E "s/^( *replaces:
          +infinispan-operator\.v)[0-9]+\.[0-9]+\.[0-9]+/\1$NEXT_VERSION/"
          config/manifests/bases/infinispan-operator.clusterserviceversion.yaml

          git add .

          git commit -m "Next Version ${{
          steps.next_version.outputs.next_version }}"

          git push origin "${{ steps.params.outputs.ref }}"
      - name: Remove scheduled job
        uses: cardinalby/unschedule-job-action@v1
        if: success()
        with:
          ghToken: '${{ secrets.PAT }}'
          deleteRefTag: false
    env:
      DELAYED_JOB_CHECKOUT_REF: 4cea4c214c4a289c258676b205b5bb31041a65b1
      DELAYED_JOB_CHECKOUT_REF_IS_TAG: 'false'
      DELAYED_JOB_WORKFLOW_FILE_PATH: .github/workflows/publish-main.yaml
      DELAYED_JOB_WORKFLOW_UNSCHEDULE_TARGET_BRANCH: test_e2e
